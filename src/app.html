<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%

		<!-- Préchargement des Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>

		<!-- Favicon -->
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />

		<!-- Manifest PWA -->
		<link rel="manifest" href="/manifest.webmanifest" />

		<!-- Apple Touch Icon (iOS) -->
		<link rel="apple-touch-icon" href="/icon-192.png" />

		<!-- Theme color pour navigateurs mobiles -->
		<meta name="theme-color" content="#3b82f6" />

		<!-- Canonical URL -->
		<link rel="canonical" href="https://planning.oupla.net/" />
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

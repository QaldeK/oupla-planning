<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Critical CSS — élimine le flash avant chargement du bundle CSS -->
		<style>
			html {
				background-color: oklch(98% 0.003 247.858);
				color: oklch(20% 0.042 265.755);
				font-family: 'Nunito', sans-serif;
			}
			body {
				margin: 0;
				min-height: 100vh;
			}
			h1,
			h2,
			h3,
			h4,
			h5,
			h6 {
				font-family: 'Fredoka', sans-serif;
			}
		</style>

		%sveltekit.head%

		<!-- Favicon -->
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />

		<!-- Manifest PWA -->
		<link rel="manifest" href="/manifest.webmanifest" />

		<!-- Apple Touch Icon (iOS) -->
		<link rel="apple-touch-icon" href="/icon-192.png" />

		<!-- Theme color pour navigateurs mobiles -->
		<meta name="theme-color" content="#3b82f6" />

		<!-- Canonical URL -->
		<link rel="canonical" href="https://planning.oupla.net/" />
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
